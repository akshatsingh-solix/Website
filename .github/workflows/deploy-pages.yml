name: Deploy frontend and SOLIXEmpower to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "empower/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}
  # Rebuild when content is published from the admin (optional backend
  # GITHUB_DEPLOY_TOKEN) and every 6 hours, so the static content snapshot
  # baked into the site stays fresh even without a token.
  repository_dispatch:
    types: [content-published]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Bake published content into the build
        env:
          REACT_APP_BACKEND_URL: ${{ vars.BACKEND_URL }}
        # Never fails the deploy: without a reachable backend the last
        # committed snapshot is used.
        run: node scripts/content-snapshot.js

      - name: Check Sol's knowledge base matches the site content
        # Warns only: the backend keeps answering from the committed file.
        run: node scripts/sol-knowledge.js --check || echo "::warning::backend/sol_knowledge.json is stale. Run 'node frontend/scripts/sol-knowledge.js' and commit it so Sol knows the latest site content."

      - name: Vendor OpenArt visuals into the build
        # Copies the visuals listed in src/data/openart-media.json into
        # public/media/openart/ so the site serves them itself. Never fails
        # the deploy: pages fall back to the OpenArt CDN, then older photos.
        run: node scripts/vendor-media.js

      - name: Build
        env:
          CI: "false"
          # Set a repository variable named BACKEND_URL (Settings > Secrets and
          # variables > Actions > Variables) once the backend is deployed, then
          # re-run this workflow. Left empty, the site still builds and loads;
          # only backend-dependent features (forms, chat, admin) stay disabled.
          REACT_APP_BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: yarn build

      # SOLIXEmpower is a separate site (Vite) served under /Website/empower/.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: empower/package-lock.json

      - name: Build SOLIXEmpower
        working-directory: empower
        env:
          VITE_BASE: /Website/empower/
          VITE_API_URL: ${{ vars.BACKEND_URL }}
          VITE_MAIN_SITE_URL: /Website/
        run: |
          npm ci
          npm run build
          rm -rf ../frontend/build/empower
          cp -r dist ../frontend/build/empower

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
