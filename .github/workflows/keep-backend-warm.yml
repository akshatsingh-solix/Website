name: Keep backend warm

# The backend's free hosting tier puts it to sleep after ~15 minutes without
# traffic, and the next visitor or admin then waits up to a minute for it to
# wake. A light ping every 10 minutes keeps it awake. One always-on free
# service fits inside the host's 750 free instance hours per month.
# Needs the BACKEND_URL repository variable (the same one the deploy uses).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: keep-backend-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then echo "BACKEND_URL is not set; nothing to ping."; exit 0; fi
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 90 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" "${BACKEND_URL%/}/api/"
