services:
  - type: web
    name: solix-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: solix
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://akshatsingh-solix.github.io
      # Sol, the AI concierge: add at least one free key. Providers are tried
      # in SOL_PROVIDER_ORDER and Sol fails over when one is rate limited.
      # OPENROUTER_API_KEY below also works for Sol. GROQ_API_KEY alone is
      # enough to run it. See README "Sol".
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: SOL_PROVIDER_ORDER
        value: gemini,groq,mistral,openrouter,custom
      # Optional: live SEO data and AI answer tracking in Admin > SEO
      - key: SEMRUSH_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODELS
        value: nvidia/nemotron-3.5-lightning:free
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: news story clusters (free key, required from cloud servers)
      # and expert-coverage deep dives ($5 free Parallel credits a month).
      - key: NEWSMCP_API_KEY
        sync: false
      - key: PARALLEL_API_KEY
        sync: false
