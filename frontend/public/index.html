<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#020817" />
        <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
        <meta name="description" content="Solix Technologies — Enterprise data management, archiving, application retirement and governed Enterprise AI. Put AI in the hands of your business." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- Fonts load without blocking the first paint; system fonts show until they arrive. -->
        <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" />
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
        <noscript><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet" /></noscript>
        <script>
          // Start the slow parts of the first visit early: open the API connection
          // (the backend may also need to wake up) and, on the homepage, fetch the
          // hero photo before the app code asks for it.
          (function () {
            var head = document.head, api = "%REACT_APP_BACKEND_URL%";
            if (/^https:\/\//.test(api)) {
              var pc = document.createElement("link"); pc.rel = "preconnect"; pc.href = api; pc.crossOrigin = ""; head.appendChild(pc);
            }
            var path = window.location.pathname.replace(/\/+$/, "");
            var redirect = new URLSearchParams(window.location.search).get("redirect");
            if ((path === "%PUBLIC_URL%" || path === "") && !redirect) {
              var l = document.createElement("link"); l.rel = "preload"; l.as = "image"; l.setAttribute("fetchpriority", "high");
              l.setAttribute("imagesrcset", "%PUBLIC_URL%/images/hero-architecture-720.webp 720w, %PUBLIC_URL%/images/hero-architecture.webp 1264w");
              l.setAttribute("imagesizes", "(min-width: 1024px) 620px, 100vw"); l.type = "image/webp";
              head.appendChild(l);
            }
          })();
        </script>
        <title>Solix Technologies | Enterprise Data Management & AI</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <script>
          // Restores the deep link 404.html redirected here (see public/404.html).
          (function () {
            var params = new URLSearchParams(window.location.search);
            var redirect = params.get("redirect");
            if (redirect) {
              params.delete("redirect");
              var rest = params.toString();
              var base = window.location.pathname.replace(/\/$/, "");
              window.history.replaceState(
                null,
                "",
                base + redirect + (rest ? (redirect.includes("?") ? "&" : "?") + rest : "")
              );
            }
          })();
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
